    function tick() {
      var diff = Math.max(0, alvo - Date.now());
      var d = Math.floor(diff / 864e5), h = Math.floor(diff / 36e5) % 24, m = Math.floor(diff / 6e4) % 60, s = Math.floor(diff / 1e3) % 60;
      var v = { d: pad(d), h: pad(h), m: pad(m), s: pad(s) };
      app.querySelectorAll('[data-cd]').forEach(function (el) { el.textContent = v[el.getAttribute('data-cd')]; });

      if (sc) sc.textContent = (d ? d + 'd ' : '') + pad(h) + ':' + pad(m) + ':' + pad(s);
    }
    if (!isNaN(alvo) && !eventoPassou()) { tick(); ofTimer = setInterval(tick, 1000); }

    // Barra fixa aparece depois do primeiro botão
    var sticky = document.getElementById('stickyQ');

    window.addEventListener('scroll', ofScroll, { passive: true });

    // Cada cartão aparece com animação quando entra na tela
    var secs = app.querySelectorAll('.reveal');
    if ('IntersectionObserver' in window) {
      ofObserver = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) { e.target.classList.add('in'); ofObserver.unobserve(e.target); }
        });
      }, { threshold: 0.12 });
      secs.forEach(function (s) { ofObserver.observe(s); });
    } else {
      secs.forEach(function (s) { s.classList.add('in'); });
    }
  }

  // Carrossel de depoimentos: arrastar + troca automática em ordem aleatória
  var carTimer = null;
  function iniciarCarrossel() {
    var car = document.getElementById('car');
    var dots = document.querySelectorAll('#dots span');
    var slides = car.querySelectorAll('.slide');
    var atual = 0;
    var passo = slides[1] ? slides[1].offsetLeft - slides[0].offsetLeft : 1;

    function marcar(i) {
      atual = i;
      dots.forEach(function (d, k) { d.classList.toggle('on', k === i); });
      slides.forEach(function (s, k) { s.classList.toggle('active', k === i); });
    }
    function irPara(i) {
      car.scrollTo({ left: i * passo, behavior: 'smooth' });
      marcar(i);
    }
    function sortear() {
      var i;
      do { i = Math.floor(Math.random() * slides.length); } while (i === atual && slides.length > 1);
      return i;
    }
    function auto() {
      clearTimeout(carTimer);
      // intervalo variável (2,6s a 4s) pra não parecer mecânico
      carTimer = setTimeout(function () { irPara(sortear()); auto(); }, 2600 + Math.random() * 1400);
    }

    car.addEventListener('scroll', function () {
      var i = Math.round(car.scrollLeft / passo);
      if (i !== atual && slides[i]) marcar(i);
    }, { passive: true });
    dots.forEach(function (d, k) { d.addEventListener('click', function () { irPara(k); auto(); }); });
    car.addEventListener('touchstart', function () { clearTimeout(carTimer); }, { passive: true });
    car.addEventListener('touchend', auto, { passive: true });
    car.addEventListener('mouseenter', function () { clearTimeout(carTimer); });
    car.addEventListener('mouseleave', auto);

    marcar(0);
    auto();
  }

  // Atalho pra testar: index.html#tela=oferta abre direto naquela tela
  var m = location.hash.match(/tela=([\w-]+)/);
  if (m) STEPS.forEach(function (s, i) { if (s.id === m[1]) current = i; });

  render();
})();
</script>
